<g class="ln" style="animation-delay:1.00s"><text class="t" x="32" y="184" font-size="16">&gt; backend &amp; developer-tooling engineer · CI/CD · automation</text></g>
<g class="ln" style="animation-delay:1.45s"><text class="t" x="32" y="214" font-size="16">&gt; building CoreMesh: AI-drafted guides, fact-checked first</text></g>
<g class="ln" style="animation-delay:1.90s"><text class="t" x="32" y="244" font-size="16">&gt; I verify every change end to end before I submit it</text></g>
<g class="ln" style="animation-delay:2.35s"><text class="t d" x="32" y="284" font-size="16">$ <tspan class="cur l">▌</tspan></text></g>
