<svg xmlns="http://www.w3.org/2000/svg" width="840" height="246" viewBox="0 0 840 246" role="img" aria-label="Open-source contributions: 6 merged pull requests across Perenna-Labs and Presago-Labs, 1 in review at BasedHardware/omi">
